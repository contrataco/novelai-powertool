name: Feature Request
description: Suggest a new feature or capability
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem does this solve? What's the use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work? Be as specific as possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Image Generation
        - Lore Creator
        - LitRPG Tracker
        - Text-to-Speech
        - Media Gallery
        - Settings
        - Companion Script
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, examples, or related features
