<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22224a"/>
      <stop offset="100%" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a74"/>
      <stop offset="100%" stop-color="#c8284a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0%" stop-color="#e94560" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e94560" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="560" r="400" fill="url(#glow)"/>

  <!-- Pen nib: writing -->
  <path d="M512 900 L318 548 C286 488 300 404 366 348 L366 150 L658 150 L658 348 C724 404 738 488 706 548 Z"
        fill="url(#nib)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="22" stroke-linejoin="round"/>
  <!-- Collar line where the nib meets the grip -->
  <line x1="366" y1="300" x2="658" y2="300" stroke="#121a33" stroke-width="26"/>

  <!-- Lightning bolt slit: the power tool -->
  <path d="M572 330 L438 600 L522 600 L470 836 L626 540 L540 540 L612 330 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>

  <!-- Sparkle: image generation -->
  <path d="M812 168 C822 236 840 254 908 264 C840 274 822 292 812 360 C802 292 784 274 716 264 C784 254 802 236 812 168 Z"
        fill="#ffd166"/>
</svg>
